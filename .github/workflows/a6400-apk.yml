name: Build A6400 Sync APK
on:
  push:
    paths: ["a6400-sync/**", ".github/workflows/a6400-apk.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: a6400-sync } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Testes com câmera simulada + build do APK
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --info 2>&1 | grep -E "LOG:|OPS:|ERRO:|Test|FAIL|BUILD|^e: "
      - uses: actions/upload-artifact@v4
        with: { name: A6400Sync-apk, path: a6400-sync/app/build/outputs/apk/debug/app-debug.apk }
