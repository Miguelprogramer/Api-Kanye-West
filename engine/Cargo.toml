[workspace]
resolver = "3"
members = ["cgi-wasm", "vendor/*"]

[workspace.package]
version = "0.21.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
effectcraft-track = { path = "vendor/track" }
effectcraft-raster = { path = "vendor/raster" }
effectcraft-geom = { path = "vendor/geom" }
effectcraft-color = { path = "vendor/color" }
effectcraft-segment = { path = "vendor/segment" }
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
web-time = "1"
tempfile = "3.27"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
